name: Unit test on push

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
    paths:
      - '**.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  lint-code:
    name: Lint code and check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install ruff, mypy & bandit
        run: |
          pip install ruff mypy bandit
      - name: Cache ruff
        uses: actions/cache@v3
        with:
          path: .ruff_cache
          key: ruff-static-py${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}
      - name: Cache mypy
        uses: actions/cache@v3
        with:
          path: .mypy_cache
          key: mypy-static-py${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}
      - name: Lint code (ruff)
        run: |
          ruff check .
      - name: Check type defs (mypy)
        run: |
          mypy .
      - name: Check for security vulnerabilities (bandit)
        run: |
          bandit -r src/
      - name: Check formatting (ruff)
        run: |
          ruff format --check .

  run-unit-tests:
    name: Run unit tests
    needs: lint-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov
      - name: Cache pytest
        uses: actions/cache@v3
        with:
          path: .pytest_cache
          key: pytest-static-py${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      # TODO: Implement codecov

  create-pull-request:
    name: Create PR
    needs: run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "[] from valid push to ${{ github.ref_name }}" \
            --base dev \
            --head "${{ github.ref_name }}" \
            --body "- [X] Passed linter
            - [X] Passed type checking
            - [X] Passed preliminary security checking
            - [X] Passed unit tests with at least 90% coverage
            - [X] Passed formatting
            - [ ] Integration tests exist
            - [ ] Integration tests passing"\
            || echo "Pull request already exists"